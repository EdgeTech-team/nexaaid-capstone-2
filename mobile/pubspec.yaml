name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  mobile_scanner: ^7.4.2
  # Design system type: Lexend (headings) + Source Sans 3 (body).
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # google_fonts -> path_provider -> path_provider_foundation 2.6+ adds a
  # native build step that fails when the Windows user folder has a space.
  # 2.5.1 is the last version without it. Remove once Flutter fixes this.
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true