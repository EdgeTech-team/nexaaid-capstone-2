name: mobile
description: "NexaAid disaster relief coordination app."
publish_to: "none"

version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  # Design system type: Lexend (headings) + Source Sans 3 (body).
  google_fonts: ^6.2.1
  pdfrx: ^2.6.5
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  # F-12: login token in the Android Keystore / iOS Keychain.
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # google_fonts -> path_provider -> path_provider_foundation 2.6+ adds a
  # native build step that fails when the Windows user folder has a space.
  # 2.5.1 is the last version without it. Remove once Flutter fixes this.
  path_provider_foundation: 2.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FDFDFD"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
